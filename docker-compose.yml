version: "3.8"
services:
  app:
    build:
      args:
        user: otm
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: octopustravelmatrix
    container_name: octopustravelmatrix-app
    restart: unless-stopped
    working_dir: /var/www
    depends_on: 
      - db
    volumes:
      - ./:/var/www
  db:
    image: mysql:8.0
    container_name: octopustravelmatrix-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./docker-compose/mysql:/docker-entrypoint-initdb.d
      - database:/var/lib/mysql
      - ./temporary:/media/remote
  phpmyadmin:
    container_name: octopustravelmatrix-pma
    image: phpmyadmin
    restart: unless-stopped
    depends_on: 
      - db
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
  nginx:
    image: nginx:1.17-alpine
    container_name: octopustravelmatrix-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d

volumes:
  database:
